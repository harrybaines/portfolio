<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420" role="img" aria-label="Illustration of Harry Baines at his desk, seen from behind, working at a laptop">
  <rect width="640" height="420" fill="#E9E4DA"/>
  <rect y="300" width="640" height="120" fill="#E1DACD"/>

  <!-- books, stacked -->
  <rect x="556" y="238" width="52" height="9" rx="1.5" fill="#5B3C29"/>
  <rect x="551" y="247" width="60" height="8" rx="1.5" fill="#C09A6B"/>
  <rect x="558" y="255" width="48" height="8" rx="1.5" fill="#17191B"/>

  <!-- mug -->
  <path d="M330 238h26v18a7 7 0 0 1-7 7h-12a7 7 0 0 1-7-7z" fill="#FBFAF7" stroke="#C2BEB4" stroke-width="1.5"/>
  <path d="M356 243h5a6 6 0 0 1 0 12h-5" fill="none" stroke="#C2BEB4" stroke-width="2.5"/>
  <path d="M337 228c3-5-3-8 0-13M348 228c3-5-3-8 0-13" stroke="#C6C1B6" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- laptop -->
  <path d="M392 250h158l16-104H408z" fill="#1E1E1E"/>
  <path d="M400 244h146l14-92H414z" fill="#2E2E2E"/>
  <path d="M414 152h146l-4 26H410z" fill="#3B3B3B"/>
  <path d="M376 250h190l10 12H366z" fill="#D9D4CA"/>
  <path d="M366 262h210v5H366z" fill="#BEB8AC"/>

  <!-- desk -->
  <rect x="34" y="262" width="572" height="14" fill="#C09A6B"/>
  <rect x="34" y="276" width="572" height="8" fill="#A5814F"/>
  <rect x="74" y="284" width="11" height="92" fill="#A5814F"/>
  <rect x="556" y="284" width="11" height="92" fill="#A5814F"/>

  <!-- him, from behind and slightly to the left -->
  <path d="M96 420 C 96 336 132 268 190 262 L 246 262 C 292 274 300 340 300 420 Z" fill="#6E4B34"/>
  <path d="M190 262 L 246 262 C 254 292 240 312 220 312 C 200 312 190 292 190 262 Z" fill="#5B3C29"/>
  <rect x="176" y="222" width="42" height="44" rx="10" fill="#B87D55"/>

  <!-- head, back of -->
  <ellipse cx="197" cy="182" rx="50" ry="54" fill="#CB9165"/>
  <path d="M147 182 C 147 146 170 126 197 126 C 226 126 247 148 247 182 C 247 212 232 232 197 232 C 164 232 147 212 147 182 Z" fill="#3A2618"/>
  <!-- ear -->
  <ellipse cx="152" cy="188" rx="9" ry="13" fill="#B87D55"/>

  <!-- cap, black with the flat peak just visible on the far side -->
  <path d="M243 144 L 288 150 L 288 162 L 243 160 Z" fill="#1E1E1E"/>
  <path d="M147 156 C 147 116 170 96 197 96 C 226 96 247 118 247 156 C 218 164 176 164 147 156 Z" fill="#141414"/>
  <path d="M147 156 C 176 164 218 164 247 156 L 246 166 C 216 174 176 174 148 166 Z" fill="#000000" opacity="0.4"/>
  <circle cx="197" cy="98" r="4.5" fill="#2A2A2A"/>
</svg>
